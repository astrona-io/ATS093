# Creates the realm inventory once, with alice and the test user bob. Both
# passwords come from the Secret inventory-secrets through placeholders.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: inventory
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    ALICE_PASSWORD:
      secret:
        name: inventory-secrets
        key: alice-password
    BOB_PASSWORD:
      secret:
        name: inventory-secrets
        key: bob-password
  realm:
    realm: inventory
    enabled: true
    users:
      - username: alice
        enabled: true
        email: alice@example.com
        emailVerified: true
        firstName: Alice
        lastName: Example
        credentials:
          - type: password
            value: ${ALICE_PASSWORD}
            temporary: false
      - username: bob
        enabled: true
        email: bob@example.com
        emailVerified: true
        firstName: Bob
        lastName: Example
        credentials:
          - type: password
            value: ${BOB_PASSWORD}
            temporary: false
    clients:
      - clientId: inventory-cli
        enabled: true
        publicClient: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: true
