# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats093-030
course_id: ATS093
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Edge Security"
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
  - id: ats093-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the three TLS modes"
    source_readings:
      - sections/section-030/module-01/course-01-tls-termination-and-proxy-headers.md
    prompt: "In which TLS mode does the proxy end TLS and send plain HTTP to Keycloak?"
    options:
      - id: a
        text: "Re-encrypt."
        explanation: "Not correct. Re-encrypt opens a new TLS connection to Keycloak."
      - id: b
        text: "Passthrough."
        explanation: "Not correct. Passthrough forwards the TLS connection untouched."
      - id: c
        text: "Edge termination."
        explanation: "Correct. Keycloak needs `http-enabled=true` and `proxy-headers`."
      - id: d
        text: "Mutual TLS."
        explanation: "Not correct. That is not one of the three proxy modes."
    correct_option: c
    explanation: "Correct. Keycloak needs `http-enabled=true` and `proxy-headers`."

  - id: ats093-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right setting for passthrough"
    source_readings:
      - sections/section-030/module-01/course-01-tls-termination-and-proxy-headers.md
    prompt: "A proxy passes the TLS connection to Keycloak without reading it. Which setting do you use?"
    options:
      - id: a
        text: "`proxy-protocol-enabled=true` and no `proxy-headers`."
        explanation: "Correct. The proxy cannot add headers to a stream it does not read."
      - id: b
        text: "`proxy-headers=xforwarded`."
        explanation: "Not correct. The proxy cannot add headers to an encrypted stream."
      - id: c
        text: "`http-enabled=true` and `proxy-headers=forwarded`."
        explanation: "Not correct. Those settings are for edge termination."
      - id: d
        text: "`hostname-strict=false` only."
        explanation: "Not correct. That does not tell Keycloak about the client connection."
    correct_option: a
    explanation: "Correct. The proxy cannot add headers to a stream it does not read."

  - id: ats093-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what the hostname setting does"
    source_readings:
      - sections/section-030/module-01/course-01-tls-termination-and-proxy-headers.md
    prompt: "What does `spec.hostname.hostname` set when it holds a full URL?"
    options:
      - id: a
        text: "The address that nginx listens on."
        explanation: "Not correct. nginx has its own configuration."
      - id: b
        text: "The name of the Kubernetes Service for Keycloak."
        explanation: "Not correct. The Service name comes from the resource name."
      - id: c
        text: "The host of the PostgreSQL database."
        explanation: "Not correct. That is `spec.db.host`."
      - id: d
        text: "The public address that Keycloak writes into tokens, redirects and discovery documents."
        explanation: "Correct. It fixes the scheme, host and port."
    correct_option: d
    explanation: "Correct. It fixes the scheme, host and port."

  - id: ats093-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the proxy headers format"
    source_readings:
      - sections/section-030/module-01/course-01-tls-termination-and-proxy-headers.md
    prompt: "nginx sends `X-Forwarded-For`, `X-Forwarded-Proto`, `X-Forwarded-Host` and `X-Forwarded-Port`. What do you set in `spec.proxy.headers`?"
    options:
      - id: a
        text: "`forwarded`"
        explanation: "Not correct. That reads the standard `Forwarded` header, which nginx does not send here."
      - id: b
        text: "`xforwarded`"
        explanation: "Correct. Keycloak reads only the format you name."
      - id: c
        text: "`passthrough`"
        explanation: "Not correct. That is not a value of `proxy.headers`."
      - id: d
        text: "`none`"
        explanation: "Not correct. Then Keycloak ignores the headers and learns nothing about the client."
    correct_option: b
    explanation: "Correct. Keycloak reads only the format you name."

  - id: ats093-030-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Say which paths a proxy should forward"
    source_readings:
      - sections/section-030/module-01/course-02-what-to-expose.md
    prompt: "Which set of path prefixes should an edge proxy forward to Keycloak?"
    options:
      - id: a
        text: "`/realms/`, `/resources/` and `/.well-known/`."
        explanation: "Correct. The public needs to sign in, not to administer."
      - id: b
        text: "`/`, `/admin/` and `/realms/`."
        explanation: "Not correct. `/` and `/admin/` must not be exposed."
      - id: c
        text: "`/admin/`, `/metrics` and `/health`."
        explanation: "Not correct. These are internal paths."
      - id: d
        text: "`/realms/master/` and `/resources/`."
        explanation: "Not correct. The master realm must stay internal."
    correct_option: a
    explanation: "Correct. The public needs to sign in, not to administer."

  - id: ats093-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Block the master realm as well as the console"
    source_readings:
      - sections/section-030/module-01/course-02-what-to-expose.md
    prompt: "You block `/admin/` at the proxy and nothing else. What is still exposed?"
    options:
      - id: a
        text: "Nothing, because the console is the only administrative path."
        explanation: "Not correct. The master realm's endpoints stay public."
      - id: b
        text: "Only the `/metrics` endpoint on port 9000."
        explanation: "Not correct. The proxy forwards port 8080, not the management port."
      - id: c
        text: "The sign-in and token endpoints of the `master` realm, where administrator accounts can be attacked."
        explanation: "Correct. Block `/realms/master/` too."
      - id: d
        text: "Only the static files under `/resources/`."
        explanation: "Not correct. Those are meant to be public."
    correct_option: c
    explanation: "Correct. Block `/realms/master/` too."

  - id: ats093-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep administrators able to reach the console"
    source_readings:
      - sections/section-030/module-01/course-02-what-to-expose.md
    prompt: "The proxy answers `403` for `/admin/`. How do administrators reach the console in the playground?"
    options:
      - id: a
        text: "Through nginx with a special header."
        explanation: "Not correct. nginx blocks `/admin/` for everyone."
      - id: b
        text: "Through a port-forward to `keycloak-service`, at the address set in `hostname.admin`."
        explanation: "Correct. Only someone with cluster access can open it."
      - id: c
        text: "By setting `permanentLockout` to `true`."
        explanation: "Not correct. That is a brute force setting, not an access path."
      - id: d
        text: "By proxying port 9000 as well."
        explanation: "Not correct. The management port is never proxied."
    correct_option: b
    explanation: "Correct. Only someone with cluster access can open it."

  - id: ats093-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know when nginx reads its configuration"
    source_readings:
      - sections/section-030/module-01/course-02-what-to-expose.md
    prompt: "You change the ConfigMap `nginx-conf`. Why does nginx still behave the old way?"
    options:
      - id: a
        text: "The ConfigMap is read only once a day."
        explanation: "Not correct. nginx does not read on a schedule."
      - id: b
        text: "The `Keycloak` resource must be edited first."
        explanation: "Not correct. nginx does not read that resource."
      - id: c
        text: "nginx caches the old file until Keycloak restarts."
        explanation: "Not correct. Restarting Keycloak has no effect on nginx."
      - id: d
        text: "nginx reads its configuration at start, so you restart the Deployment."
        explanation: "Correct. Run a rollout restart after each change."
    correct_option: d
    explanation: "Correct. Run a rollout restart after each change."

  - id: ats093-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a lockout type"
    source_readings:
      - sections/section-030/module-01/course-03-brute-force-and-rate-limiting.md
    prompt: "Why is a temporary lockout usually better than a permanent one?"
    options:
      - id: a
        text: "A permanent lockout is slower to check."
        explanation: "Not correct. Speed is not the reason."
      - id: b
        text: "A temporary lockout resets the password of the user."
        explanation: "Not correct. A lockout never changes the password."
      - id: c
        text: "With a permanent lockout, anyone who knows a user name can lock that user out for good."
        explanation: "Correct. A temporary lockout ends on its own."
      - id: d
        text: "A permanent lockout works only with a rate limit."
        explanation: "Not correct. The two features are independent."
    correct_option: c
    explanation: "Correct. A temporary lockout ends on its own."

  - id: ats093-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why both brute force detection and a rate limit are needed"
    source_readings:
      - sections/section-030/module-01/course-03-brute-force-and-rate-limiting.md
    prompt: "An attacker tries one password each for thousands of different users. Which defence stops this?"
    options:
      - id: a
        text: "A rate limit per client address at the proxy."
        explanation: "Correct. Brute force detection counts failures for one user at a time."
      - id: b
        text: "Brute force detection with a lower `failureFactor`."
        explanation: "Not correct. Each user stays below the count."
      - id: c
        text: "A permanent lockout for every user."
        explanation: "Not correct. Each user fails only once, so none is locked."
      - id: d
        text: "Hiding the `master` realm."
        explanation: "Not correct. The attack targets another realm."
    correct_option: a
    explanation: "Correct. Brute force detection counts failures for one user at a time."

  - id: ats093-030-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the effect of a fixed hostname"
    source_readings:
      - sections/section-030/module-02/course-01-the-hostname-options.md
    prompt: "`hostname` is set to a full URL. A request arrives with `X-Forwarded-Host: evil.example.com`. Which host does the issuer use?"
    options:
      - id: a
        text: "The IP address of the proxy."
        explanation: "Not correct. The proxy address is not used."
      - id: b
        text: "The configured hostname."
        explanation: "Correct. A fixed hostname does not trust the header."
      - id: c
        text: "evil.example.com"
        explanation: "Not correct. That would be the case only with a dynamic hostname."
      - id: d
        text: "The Service name."
        explanation: "Not correct. The Service name is for the backchannel."
    correct_option: b
    explanation: "Correct. A fixed hostname does not trust the header."

  - id: ats093-030-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the risk of hostname-strict false"
    source_readings:
      - sections/section-030/module-02/course-01-the-hostname-options.md
    prompt: "What is the risk of `hostname-strict=false`?"
    options:
      - id: a
        text: "Cache entries are lost."
        explanation: "Not correct. Caches are unrelated."
      - id: b
        text: "Host header injection into generated URLs."
        explanation: "Correct. Use it only if the proxy overwrites the headers."
      - id: c
        text: "Tokens are no longer signed."
        explanation: "Not correct. Signing is unrelated."
      - id: d
        text: "The database connection is unencrypted."
        explanation: "Not correct. The database is unrelated."
    correct_option: b
    explanation: "Correct. Use it only if the proxy overwrites the headers."

  - id: ats093-030-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the admin hostname"
    source_readings:
      - sections/section-030/module-02/course-01-the-hostname-options.md
    prompt: "Does `hostname-admin` block the Administration REST API on the public hostname?"
    options:
      - id: a
        text: "No, because the API is disabled by default."
        explanation: "Not correct. The API is enabled."
      - id: b
        text: "No. Block the paths on the proxy."
        explanation: "Correct. The option only moves where the console loads from."
      - id: c
        text: "Yes, the API moves entirely."
        explanation: "Not correct. The public address still serves it."
      - id: d
        text: "Yes, but only for the master realm."
        explanation: "Not correct. It is not realm specific."
    correct_option: b
    explanation: "Correct. The option only moves where the console loads from."

  - id: ats093-030-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose what clients match"
    source_readings:
      - sections/section-030/module-02/course-02-certificates-and-trust.md
    prompt: "Which certificate field do modern clients match against the host name?"
    options:
      - id: a
        text: "The serial number."
        explanation: "Not correct. The serial is an identifier."
      - id: b
        text: "The subject alternative name."
        explanation: "Correct. A missing alternative name fails the check."
      - id: c
        text: "The common name."
        explanation: "Not correct. The common name alone is not enough."
      - id: d
        text: "The issuer."
        explanation: "Not correct. The issuer names the signer."
    correct_option: b
    explanation: "Correct. A missing alternative name fails the check."

  - id: ats093-030-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Replace a TLS Secret correctly"
    source_readings:
      - sections/section-030/module-02/course-02-certificates-and-trust.md
    prompt: "You replaced the Secret `edge-tls` but nginx still serves the old certificate. What is missing?"
    options:
      - id: a
        text: "A new database password."
        explanation: "Not correct. The database is unrelated."
      - id: b
        text: "A restart of nginx."
        explanation: "Correct. nginx loads the certificate at start."
      - id: c
        text: "A new realm import."
        explanation: "Not correct. The realm is unrelated."
      - id: d
        text: "A change of `hostname`."
        explanation: "Not correct. The name has not changed."
    correct_option: b
    explanation: "Correct. nginx loads the certificate at start."

  - id: ats093-030-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply a Secret that exists"
    source_readings:
      - sections/section-030/module-02/course-02-certificates-and-trust.md
    prompt: "`kubectl create secret tls edge-tls` fails because the Secret exists. What replaces it?"
    options:
      - id: a
        text: "`kubectl patch keycloak`"
        explanation: "Not correct. The Keycloak resource is not the Secret."
      - id: b
        text: "Render with `--dry-run=client -o yaml` and apply."
        explanation: "Correct. `kubectl apply` updates the Secret."
      - id: c
        text: "`kubectl delete namespace`"
        explanation: "Not correct. That deletes everything."
      - id: d
        text: "`kubectl rollout undo`"
        explanation: "Not correct. That is for Deployments."
    correct_option: b
    explanation: "Correct. `kubectl apply` updates the Secret."

  - id: ats093-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Add a certificate authority to Keycloak"
    source_readings:
      - sections/section-030/module-02/course-02-certificates-and-trust.md
    prompt: "Where do you add a certificate authority that Keycloak must trust in the operator?"
    options:
      - id: a
        text: "`spec.proxy`"
        explanation: "Not correct. That is for proxy headers."
      - id: b
        text: "`spec.truststores`"
        explanation: "Correct. Point it at a Secret or ConfigMap with the PEM files."
      - id: c
        text: "`spec.http.tlsSecret`"
        explanation: "Not correct. That is Keycloak's own certificate."
      - id: d
        text: "`spec.hostname`"
        explanation: "Not correct. That is the public address."
    correct_option: b
    explanation: "Correct. Point it at a Secret or ConfigMap with the PEM files."

  - id: ats093-030-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the client auth values"
    source_readings:
      - sections/section-030/module-02/course-03-mutual-tls-and-client-certificates.md
    prompt: "Which `https-client-auth` value accepts clients without a certificate but asks for one?"
    options:
      - id: a
        text: "`optional-no-ca`"
        explanation: "Not correct. That is not a value."
      - id: b
        text: "`request`"
        explanation: "Correct. The flow then decides what to do with it."
      - id: c
        text: "`none`"
        explanation: "Not correct. `none` does not ask."
      - id: d
        text: "`required`"
        explanation: "Not correct. `required` refuses clients without one."
    correct_option: b
    explanation: "Correct. The flow then decides what to do with it."

  - id: ats093-030-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Secure a certificate header"
    source_readings:
      - sections/section-030/module-02/course-03-mutual-tls-and-client-certificates.md
    prompt: "What must a proxy do when it passes the client certificate in a header?"
    options:
      - id: a
        text: "Send it over plain HTTP."
        explanation: "Not correct. The network must also be restricted."
      - id: b
        text: "Overwrite the header on every request."
        explanation: "Correct. Otherwise a client can forge it."
      - id: c
        text: "Pass the header the client sent."
        explanation: "Not correct. A client could forge the certificate."
      - id: d
        text: "Encode it in base64 only."
        explanation: "Not correct. Encoding is not protection."
    correct_option: b
    explanation: "Correct. Otherwise a client can forge it."

  - id: ats093-030-q20
    type: single_choice
    difficulty: beginner
    learning_objective: "Order the checks"
    source_readings:
      - sections/section-030/module-02/course-04-diagnosing-tls-and-hostname-problems.md
    prompt: "A user reports a certificate warning. Which check comes first after confirming the port is reachable?"
    options:
      - id: a
        text: "The cache sizes."
        explanation: "Not correct. Caches are not involved."
      - id: b
        text: "The TLS handshake and the certificate with `openssl s_client`."
        explanation: "Correct. Check the names and dates it presents."
      - id: c
        text: "The realm import status."
        explanation: "Not correct. The import is not involved in TLS."
      - id: d
        text: "The database pool."
        explanation: "Not correct. The pool is not involved."
    correct_option: b
    explanation: "Correct. Check the names and dates it presents."

  - id: ats093-030-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Know when a password policy applies"
    source_readings:
      - sections/section-030/module-03/course-01-password-and-account-policies.md
    prompt: "You add `length(12)` to the password policy. What happens to existing passwords?"
    options:
      - id: a
        text: "They are all reset."
        explanation: "Not correct. Nothing is reset."
      - id: b
        text: "They are rehashed to 12 characters."
        explanation: "Not correct. Hashes cannot be extended."
      - id: c
        text: "Users are locked out."
        explanation: "Not correct. Sign-in is unchanged."
      - id: d
        text: "They stay valid until users change them."
        explanation: "Correct. The policy applies when a password is set."
    correct_option: d
    explanation: "Correct. The policy applies when a password is set."

  - id: ats093-030-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the strongest rule"
    source_readings:
      - sections/section-030/module-03/course-01-password-and-account-policies.md
    prompt: "Which rule gives the most protection per rule in current guidance?"
    options:
      - id: a
        text: "Forced rotation every 30 days."
        explanation: "Not correct. Rotation leads to predictable changes."
      - id: b
        text: "Requiring one symbol."
        explanation: "Not correct. Symbols add little."
      - id: c
        text: "Banning vowels."
        explanation: "Not correct. This is not a rule."
      - id: d
        text: "A minimum length."
        explanation: "Correct. Length beats character classes."
    correct_option: d
    explanation: "Correct. Length beats character classes."

  - id: ats093-030-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain slow hashing"
    source_readings:
      - sections/section-030/module-03/course-01-password-and-account-policies.md
    prompt: "Why is password hashing made slow on purpose?"
    options:
      - id: a
        text: "To delay users at sign-in."
        explanation: "Not correct. Delay is a side effect."
      - id: b
        text: "To save database space."
        explanation: "Not correct. Size is unrelated."
      - id: c
        text: "To encrypt the tokens."
        explanation: "Not correct. Tokens are signed, not hashed."
      - id: d
        text: "To make guessing from a stolen database expensive."
        explanation: "Correct. It costs CPU on every sign-in too."
    correct_option: d
    explanation: "Correct. It costs CPU on every sign-in too."

  - id: ats093-030-q24
    type: single_choice
    difficulty: beginner
    learning_objective: "Know the event defaults"
    source_readings:
      - sections/section-030/module-03/course-02-sessions-tokens-and-events.md
    prompt: "Are login events and administration events on by default?"
    options:
      - id: a
        text: "Yes, both are on."
        explanation: "Not correct. They are off."
      - id: b
        text: "Only login events are on."
        explanation: "Not correct. Both are off."
      - id: c
        text: "Only administration events are on."
        explanation: "Not correct. Both are off."
      - id: d
        text: "No, both are off."
        explanation: "Correct. You must turn them on."
    correct_option: d
    explanation: "Correct. You must turn them on."

  - id: ats093-030-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the event streams apart"
    source_readings:
      - sections/section-030/module-03/course-02-sessions-tokens-and-events.md
    prompt: "Which stream answers who changed a client redirect URI?"
    options:
      - id: a
        text: "Login events."
        explanation: "Not correct. Login events record sign-ins."
      - id: b
        text: "The access log of the proxy only."
        explanation: "Not correct. It does not know who."
      - id: c
        text: "Brute force detection."
        explanation: "Not correct. It limits guessing."
      - id: d
        text: "Administration events."
        explanation: "Correct. They record configuration changes."
    correct_option: d
    explanation: "Correct. They record configuration changes."

  - id: ats093-030-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain refresh token revocation"
    source_readings:
      - sections/section-030/module-03/course-02-sessions-tokens-and-events.md
    prompt: "What does `revokeRefreshToken=true` change?"
    options:
      - id: a
        text: "Access tokens last longer."
        explanation: "Not correct. Lifespans are separate."
      - id: b
        text: "Sessions never expire."
        explanation: "Not correct. Expiry is separate."
      - id: c
        text: "Offline tokens are deleted."
        explanation: "Not correct. Offline tokens are separate."
      - id: d
        text: "Each refresh token can be used once."
        explanation: "Correct. A replay ends the session."
    correct_option: d
    explanation: "Correct. A replay ends the session."

  - id: ats093-030-q27
    type: single_choice
    difficulty: advanced
    learning_objective: "Weigh the access token lifespan"
    source_readings:
      - sections/section-030/module-03/course-02-sessions-tokens-and-events.md
    prompt: "Why is a short access token the strongest control against a stolen token?"
    options:
      - id: a
        text: "Keycloak checks it at every request."
        explanation: "Not correct. It does not call Keycloak."
      - id: b
        text: "It cannot be copied."
        explanation: "Not correct. A bearer token can be copied."
      - id: c
        text: "It is encrypted."
        explanation: "Not correct. It is signed."
      - id: d
        text: "A resource server trusts the signature until it expires."
        explanation: "Correct. Without introspection it cannot be revoked."
    correct_option: d
    explanation: "Correct. Without introspection it cannot be revoked."

  - id: ats093-030-q28
    type: single_choice
    difficulty: beginner
    learning_objective: "Treat the bootstrap account"
    source_readings:
      - sections/section-030/module-03/course-03-the-server-and-the-administrator.md
