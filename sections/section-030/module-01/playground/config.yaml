# Put Keycloak Behind A Reverse Proxy (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, prepares the environment, then stays running
# for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-093-playground-030-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install the Keycloak Operator 26.8.1, PostgreSQL and the tester pod, then start Keycloak behind an nginx edge proxy."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Namespace keycloak, PostgreSQL, the database and realm Secrets, and the tester client."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nginx:1.27-alpine
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
