# Harden The Realm Settings Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-093-lab-030-03-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-operator"
      description: "Installs the Keycloak Operator 26.8.1, PostgreSQL and the tester pod in the namespace keycloak"
      type: "file"
      source: "bootstrap/01-install-operator.sh"
    - name: "ats-093-lab-030-03-01-setup"
      description: "Starts Keycloak and imports the realm inventory with default security settings"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits for the operator and PostgreSQL before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-password-policy"
      description: "Confirms the password policy has length(12) and a short password is refused"
      type: "file"
      source: "validation/validate-password-policy.sh"
    - name: "validate-events"
      description: "Confirms login events, admin events and admin event details are enabled"
      type: "file"
      source: "validation/validate-events.sh"
    - name: "validate-refresh-and-users"
      description: "Confirms refresh token revocation is on and alice still gets a token"
      type: "file"
      source: "validation/validate-refresh-and-users.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
