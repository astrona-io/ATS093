# Make Keycloak Observable End To End Capstone
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-093-capstone-050"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-operator"
      description: "Installs the Keycloak Operator 26.8.1, PostgreSQL and the tester pod in the namespace keycloak"
      type: "file"
      source: "bootstrap/01-install-operator.sh"
    - name: "ats-093-capstone-050-setup"
      description: "Starts Keycloak with debug logs, no metrics and a realm without events"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits for the operator and PostgreSQL before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-metrics"
      description: "Confirms /metrics on port 9000 returns metrics and health is still UP"
      type: "file"
      source: "validation/validate-metrics.sh"
    - name: "validate-logging"
      description: "Confirms JSON console output, root level info and org.keycloak.events at debug"
      type: "file"
      source: "validation/validate-logging.sh"
    - name: "validate-events"
      description: "Confirms events are on with an expiration, and a failed login becomes a LOGIN_ERROR event"
      type: "file"
      source: "validation/validate-events.sh"
    - name: "validate-alice"
      description: "Confirms alice still gets a token"
      type: "file"
      source: "validation/validate-alice.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
