# Make Keycloak Observable Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-093-lab-050-01-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-operator"
      description: "Installs the Keycloak Operator 26.8.1, PostgreSQL and the tester pod in the namespace keycloak"
      type: "file"
      source: "bootstrap/01-install-operator.sh"
    - name: "ats-093-lab-050-01-01-setup"
      description: "Starts Keycloak with plain logs, health and metrics on"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits for the operator and PostgreSQL before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-json-logs"
      description: "Confirms log-console-output is json and the latest log lines parse as JSON"
      type: "file"
      source: "validation/validate-json-logs.sh"
    - name: "validate-events-category"
      description: "Confirms the log level has the category org.keycloak.events at debug"
      type: "file"
      source: "validation/validate-events-category.sh"
    - name: "validate-health-metrics"
      description: "Confirms ready health, metrics on port 9000 and a ServiceMonitor interval of 15s"
      type: "file"
      source: "validation/validate-health-metrics.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
