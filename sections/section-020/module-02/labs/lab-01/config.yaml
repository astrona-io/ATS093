# Limit The Embedded Caches Lab
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-093-lab-020-02-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-operator"
      description: "Installs the Keycloak Operator 26.8.1, PostgreSQL and the tester pod in the namespace keycloak"
      type: "file"
      source: "bootstrap/01-install-operator.sh"
    - name: "ats-093-lab-020-02-01-setup"
      description: "Starts a two-instance Keycloak and imports the realm inventory"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits for the operator and PostgreSQL before the reference solution runs"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-cache-limits"
      description: "Confirms the two cache limits are set in the Keycloak resource"
      type: "file"
      source: "validation/validate-cache-limits.sh"
    - name: "validate-limits-in-pods"
      description: "Confirms both pods carry the cache limits as environment variables"
      type: "file"
      source: "validation/validate-limits-in-pods.sh"
    - name: "validate-cluster-and-metrics"
      description: "Confirms two ready instances, vendor_cluster_size 2 on each, and the earlier options kept"
      type: "file"
      source: "validation/validate-cluster-and-metrics.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - postgres:17-alpine
