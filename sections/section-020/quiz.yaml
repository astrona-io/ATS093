# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats093-020
course_id: ATS093
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Databases And Clustering"
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
  - id: ats093-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "List what Keycloak keeps in the database"
    source_readings:
      - sections/section-020/module-01/course-01-the-database-is-the-source-of-truth.md
    prompt: "Which data does Keycloak 26 write to PostgreSQL by default?"
    options:
      - id: a
        text: "Only realms and clients; users live in the pod."
        explanation: "Not correct. Users and password hashes are in the database."
      - id: b
        text: "Realms, clients, users and their password hashes, signing keys and user sessions."
        explanation: "Correct. Persistent user sessions are on by default in Keycloak 26."
      - id: c
        text: "Only users; realm settings live in the `Keycloak` resource."
        explanation: "Not correct. Realm settings are stored in the database too."
      - id: d
        text: "Everything except user sessions, which are never stored."
        explanation: "Not correct. Since Keycloak 26 sessions are stored as well."
    correct_option: b
    explanation: "Correct. Persistent user sessions are on by default in Keycloak 26."

  - id: ats093-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why sessions survive a full restart"
    source_readings:
      - sections/section-020/module-01/course-01-the-database-is-the-source-of-truth.md
    prompt: "All Keycloak pods are deleted and then start again. Why can alice still use her refresh token?"
    options:
      - id: a
        text: "The refresh token is valid forever and needs no session."
        explanation: "Not correct. Keycloak accepts a refresh token only while the session exists."
      - id: b
        text: "The StatefulSet keeps the memory of the deleted pods."
        explanation: "Not correct. The memory of a deleted pod is gone."
      - id: c
        text: "The tester pod stores the session for Keycloak."
        explanation: "Not correct. The tester pod is only a client."
      - id: d
        text: "Her session is stored in PostgreSQL, and Keycloak reads it back."
        explanation: "Correct. Persistent user sessions live in the database."
    correct_option: d
    explanation: "Correct. Persistent user sessions live in the database."

  - id: ats093-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Size the database for several instances"
    source_readings:
      - sections/section-020/module-01/course-01-the-database-is-the-source-of-truth.md
    prompt: "Each Keycloak instance opens its own connection pool. What follows for the database?"
    options:
      - id: a
        text: "The instances share one pool, so the number of instances does not matter."
        explanation: "Not correct. Every instance opens its own pool."
      - id: b
        text: "Only the first instance connects; the others wait."
        explanation: "Not correct. Every instance connects."
      - id: c
        text: "The maximum number of connections is `poolMaxSize` multiplied by the number of instances."
        explanation: "Correct. Size the database for all instances together."
      - id: d
        text: "The operator limits the total to the `instances` value."
        explanation: "Not correct. The operator does not cap the total number of connections."
    correct_option: c
    explanation: "Correct. Size the database for all instances together."

  - id: ats093-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid writing to Keycloak tables directly"
    source_readings:
      - sections/section-020/module-01/course-01-the-database-is-the-source-of-truth.md
    prompt: "Why should you not change Keycloak tables with SQL?"
    options:
      - id: a
        text: "The pods keep cached copies and never see the change."
        explanation: "Correct. Use the Admin REST API, `kcadm.sh` or the console instead."
      - id: b
        text: "PostgreSQL does not allow a second user to write to them."
        explanation: "Not correct. The database allows it; the problem is the caches."
      - id: c
        text: "Keycloak rebuilds all tables at every start."
        explanation: "Not correct. Keycloak keeps its tables between starts."
      - id: d
        text: "The tables are read-only for the user `keycloak`."
        explanation: "Not correct. The user can write; that is not the reason."
    correct_option: a
    explanation: "Correct. Use the Admin REST API, `kcadm.sh` or the console instead."

  - id: ats093-020-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell the three cache kinds apart"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Which Keycloak cache is replicated, so every pod holds a copy of its entries?"
    options:
      - id: a
        text: "The `realms` cache."
        explanation: "Not correct. `realms` is a local cache."
      - id: b
        text: "The `sessions` cache."
        explanation: "Not correct. `sessions` is distributed, held on a set number of owners."
      - id: c
        text: "The `loginFailures` cache."
        explanation: "Not correct. `loginFailures` is distributed."
      - id: d
        text: "The `work` cache, which carries invalidation messages."
        explanation: "Correct. It tells the other pods that their local copy is stale."
    correct_option: d
    explanation: "Correct. It tells the other pods that their local copy is stale."

  - id: ats093-020-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the default cache mode in production"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Which value of the `cache` option gives each pod private caches and no cluster?"
    options:
      - id: a
        text: "`ispn`"
        explanation: "Not correct. `ispn` is the clustered mode that the operator uses."
      - id: b
        text: "`local`"
        explanation: "Correct. It is the default only in development mode."
      - id: c
        text: "`jdbc-ping`"
        explanation: "Not correct. That is a cache stack for discovery, not a cache mode."
      - id: d
        text: "`distributed`"
        explanation: "Not correct. That is not a value of the `cache` option."
    correct_option: b
    explanation: "Correct. It is the default only in development mode."

  - id: ats093-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain jdbc-ping discovery"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "How does the default `jdbc-ping` stack let Keycloak pods find each other?"
    options:
      - id: a
        text: "Each instance writes its address into a table in the Keycloak database and reads the others from there."
        explanation: "Correct. No extra Service or cloud API is needed."
      - id: b
        text: "The operator sends every pod the list of all pod IP addresses."
        explanation: "Not correct. The pods find each other themselves through the database."
      - id: c
        text: "Each pod broadcasts its address to the whole node network."
        explanation: "Not correct. Discovery uses the shared database."
      - id: d
        text: "The pods read the names from the `keycloak-discovery` Service logs."
        explanation: "Not correct. Discovery reads database rows, not logs."
    correct_option: a
    explanation: "Correct. No extra Service or cloud API is needed."

  - id: ats093-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the network policy setting for clustering"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Clustering ports 7800 and 57800 are closed to other pods. What should you do with `spec.networkPolicy.enabled`?"
    options:
      - id: a
        text: "Set it to `false` so the pods can reach each other."
        explanation: "Not correct. That opens the ports to every pod and does not help clustering."
      - id: b
        text: "Set it to `false` only for the second instance."
        explanation: "Not correct. The setting applies to the whole resource."
      - id: c
        text: "Leave it `true`; the policy already lets the Keycloak pods reach each other."
        explanation: "Correct. Switching it off only opens the ports to every pod."
      - id: d
        text: "Delete the Service `keycloak-discovery`."
        explanation: "Not correct. That removes the discovery address and breaks more."
    correct_option: c
    explanation: "Correct. Switching it off only opens the ports to every pod."

  - id: ats093-020-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Find the best proof of a cluster"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Two pods are `Running` and ready. What is the most reliable proof that they form one cluster?"
    options:
      - id: a
        text: "`kubectl get pods` shows two pods as `Ready`."
        explanation: "Not correct. Two ready pods can be two separate servers."
      - id: b
        text: "The metric `vendor_cluster_size` equals the number of instances on every pod."
        explanation: "Correct. A pod that runs alone reports 1."
      - id: c
        text: "A token from one pod is accepted by the other."
        explanation: "Not correct. Sessions and keys come from the database, so this works without a cluster."
      - id: d
        text: "The `Keycloak` resource reports `Ready=True`."
        explanation: "Not correct. It reports readiness, not membership."
    correct_option: b
    explanation: "Correct. A pod that runs alone reports 1."

  - id: ats093-020-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a two-pod deployment that is not a cluster"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "A client changed in the console on one pod keeps old settings on the other. Both pods report `vendor_cluster_size` 1. What is the likely cause?"
    options:
      - id: a
        text: "The database is down, so the pods cannot save the client."
        explanation: "Not correct. A database outage would make the console fail, not show old settings."
      - id: b
        text: "`health-enabled` is set to `true`."
        explanation: "Not correct. That option only enables health endpoints."
      - id: c
        text: "The Service `keycloak-service` has no endpoints."
        explanation: "Not correct. Clients would then get no answer at all."
      - id: d
        text: "An `additionalOptions` entry sets `cache` to `local`."
        explanation: "Correct. Each pod then runs alone and no invalidation messages cross."
    correct_option: d
    explanation: "Correct. Each pod then runs alone and no invalidation messages cross."

  - id: ats093-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the default size of a local cache"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "What is the default limit of the `users` cache?"
    options:
      - id: a
        text: "100,000 entries in the cluster."
        explanation: "Not correct. The limit counts per node."
      - id: b
        text: "10,000 entries per node."
        explanation: "Correct. The `keys` cache is the one with 1,000 entries."
      - id: c
        text: "1,000 entries per node."
        explanation: "Not correct. 1,000 is the default of the `keys` cache."
      - id: d
        text: "Unlimited."
        explanation: "Not correct. All local caches have a default limit."
    correct_option: b
    explanation: "Correct. The `keys` cache is the one with 1,000 entries."

  - id: ats093-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Build a cache option name"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "Which option bounds the cache `offlineSessions`?"
    options:
      - id: a
        text: "`spi-cache-embedded--offline--max`"
        explanation: "Not correct. That is not a cache option."
      - id: b
        text: "`cache-embedded-offline-sessions-max-count`"
        explanation: "Correct. The cache name is lower case with dashes."
      - id: c
        text: "`cache-embedded-offlineSessions-max-count`"
        explanation: "Not correct. The name is not written in camel case."
      - id: d
        text: "`cache-offline-sessions-limit`"
        explanation: "Not correct. That option does not exist."
    correct_option: b
    explanation: "Correct. The cache name is lower case with dashes."

  - id: ats093-020-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know which caches cannot be bounded"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "On which cache can you NOT set a maximum count?"
    options:
      - id: a
        text: "`offline-sessions`"
        explanation: "Not correct. Offline sessions can be bounded."
      - id: b
        text: "`actionTokens`"
        explanation: "Correct. Also `authenticationSessions` and `work`."
      - id: c
        text: "`users`"
        explanation: "Not correct. `users` can be bounded."
      - id: d
        text: "`realms`"
        explanation: "Not correct. `realms` can be bounded."
    correct_option: b
    explanation: "Correct. Also `authenticationSessions` and `work`."

  - id: ats093-020-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand what a limit counts"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "Two pods each limit `users` to 2,000 entries. How many user entries can the cluster hold in its local caches?"
    options:
      - id: a
        text: "Unlimited, because the limit is a hint."
        explanation: "Not correct. Infinispan evicts entries at the limit."
      - id: b
        text: "Up to 4,000, because each pod has its own copy."
        explanation: "Correct. The limit is per node."
      - id: c
        text: "2,000, shared by both pods."
        explanation: "Not correct. Local caches are not shared."
      - id: d
        text: "1,000 on each pod."
        explanation: "Not correct. The limit is not divided."
    correct_option: b
    explanation: "Correct. The limit is per node."

  - id: ats093-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the supported way to change cache defaults"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "What is the supported way to change a default cache setting?"
    options:
      - id: a
        text: "Delete the cache in the database."
        explanation: "Not correct. Caches are not stored in the database."
      - id: b
        text: "A `cache-` option."
        explanation: "Correct. XML overrides are possible but not supported."
      - id: c
        text: "Edit `cache-ispn.xml` in the image."
        explanation: "Not correct. Overriding the XML is not supported."
      - id: d
        text: "Patch the StatefulSet."
        explanation: "Not correct. Pod edits are overwritten by the operator."
    correct_option: b
    explanation: "Correct. XML overrides are possible but not supported."

  - id: ats093-020-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain persistent user sessions"
    source_readings:
      - sections/section-020/module-02/course-02-sessions-in-memory-and-in-the-database.md
    prompt: "With persistent user sessions, where is the source of truth for a user session?"
    options:
      - id: a
        text: "The browser cookie."
        explanation: "Not correct. The cookie only points at the session."
      - id: b
        text: "The database."
        explanation: "Correct. The caches are loaded on demand."
      - id: c
        text: "The `sessions` cache."
        explanation: "Not correct. The cache is a copy."
      - id: d
        text: "The pod that created it."
        explanation: "Not correct. Other pods read the session as well."
    correct_option: b
    explanation: "Correct. The caches are loaded on demand."

  - id: ats093-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Weigh disabling session caching"
    source_readings:
      - sections/section-020/module-02/course-02-sessions-in-memory-and-in-the-database.md
    prompt: "What is the main cost of setting `spi-user-sessions--infinispan--use-caches=false`?"
    options:
      - id: a
        text: "Tokens can no longer be refreshed."
        explanation: "Not correct. Refresh still works."
      - id: b
        text: "More database reads and connections."
        explanation: "Correct. Every session read goes to the database."
      - id: c
        text: "Sessions are lost on restart."
        explanation: "Not correct. The sessions stay in the database."
      - id: d
        text: "The cluster cannot form."
        explanation: "Not correct. Discovery is not changed."
    correct_option: b
    explanation: "Correct. Every session read goes to the database."

  - id: ats093-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recognise a deprecated mode"
    source_readings:
      - sections/section-020/module-02/course-02-sessions-in-memory-and-in-the-database.md
    prompt: "What does `--features-disabled=persistent-user-sessions` do, and what is its status?"
    options:
      - id: a
        text: "It disables the caches; it is required for multi-site."
        explanation: "Not correct. It is not required."
      - id: b
        text: "It keeps sessions in memory only; it is deprecated."
        explanation: "Correct. Remove the setting."
      - id: c
        text: "It keeps sessions in the database; it is the default."
        explanation: "Not correct. That is the default without the setting."
      - id: d
        text: "It turns off offline tokens; it is supported."
        explanation: "Not correct. Offline tokens are not turned off."
    correct_option: b
    explanation: "Correct. Remove the setting."

  - id: ats093-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the discovery of the default stack"
    source_readings:
      - sections/section-020/module-02/course-03-cluster-transport-and-its-security.md
    prompt: "How do pods discover each other with the default `jdbc-ping` stack?"
    options:
      - id: a
        text: "They read a ConfigMap."
        explanation: "Not correct. No ConfigMap is involved."
      - id: b
        text: "They register in a table of the Keycloak database."
        explanation: "Correct. No extra service is needed."
      - id: c
        text: "They use IP multicast."
        explanation: "Not correct. Multicast is for the deprecated stacks."
      - id: d
        text: "They query the Kubernetes API."
        explanation: "Not correct. The kubernetes stack uses DNS and is deprecated."
    correct_option: b
    explanation: "Correct. No extra service is needed."

  - id: ats093-020-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Diagnose a mesh problem"
    source_readings:
      - sections/section-020/module-02/course-03-cluster-transport-and-its-security.md
    prompt: "The log shows `JGRP000006: failed accepting connection from peer SSLSocket` after the cluster is placed in a service mesh. What is the likely cause?"
    options:
      - id: a
        text: "The realm import failed."
        explanation: "Not correct. The import is not involved."
      - id: b
        text: "The mesh interferes with the mutual TLS between the Keycloak pods."
        explanation: "Correct. Allow direct mTLS on port 7800 or rely on the mesh."
      - id: c
        text: "The database password is wrong."
        explanation: "Not correct. A wrong password fails the database connection."
      - id: d
        text: "The cache limits are too low."
        explanation: "Not correct. Limits do not affect the handshake."
    correct_option: b
    explanation: "Correct. Allow direct mTLS on port 7800 or rely on the mesh."

  - id: ats093-020-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate disruption kinds"
    source_readings:
      - sections/section-020/module-03/course-01-planned-and-unplanned-disruption.md
    prompt: "Which event can a `PodDisruptionBudget` stop?"
    options:
      - id: a
        text: "A node losing power."
        explanation: "Not correct. That is involuntary."
      - id: b
        text: "A pod killed for running out of memory."
        explanation: "Not correct. That is involuntary."
      - id: c
        text: "A network link breaking."
        explanation: "Not correct. That is involuntary."
      - id: d
        text: "A node drain that evicts a pod."
        explanation: "Correct. Drains use the eviction API."
    correct_option: d
    explanation: "Correct. Drains use the eviction API."

  - id: ats093-020-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a budget"
    source_readings:
      - sections/section-020/module-03/course-01-planned-and-unplanned-disruption.md
    prompt: "Two Keycloak pods, budget `minAvailable: 2`. What does `ALLOWED DISRUPTIONS` show?"
    options:
      - id: a
        text: "1"
        explanation: "Not correct. That would leave one pod."
      - id: b
        text: "2"
        explanation: "Not correct. Two pods are the whole set."
      - id: c
        text: "Unlimited"
        explanation: "Not correct. The budget limits it."
      - id: d
        text: "0"
        explanation: "Correct. Evicting a pod would go below the minimum."
    correct_option: d
    explanation: "Correct. Evicting a pod would go below the minimum."

  - id: ats093-020-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a safe rule"
    source_readings:
      - sections/section-020/module-03/course-01-planned-and-unplanned-disruption.md
    prompt: "Which budget rule for a two-pod cluster lets a drain proceed one pod at a time?"
    options:
      - id: a
        text: "`minAvailable: 2`"
        explanation: "Not correct. It blocks every eviction."
      - id: b
        text: "`maxUnavailable: 0`"
        explanation: "Not correct. It blocks every eviction."
      - id: c
        text: "Both `minAvailable: 1` and `maxUnavailable: 1`"
        explanation: "Not correct. A budget accepts only one of the two fields."
      - id: d
        text: "`maxUnavailable: 1`"
        explanation: "Correct. One pod may be missing."
    correct_option: d
    explanation: "Correct. One pod may be missing."

  - id: ats093-020-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Spot a budget that protects nothing"
    source_readings:
      - sections/section-020/module-03/course-01-planned-and-unplanned-disruption.md
    prompt: "A budget shows `expectedPods` of 0. What is wrong?"
    options:
      - id: a
        text: "The pods are not Ready."
        explanation: "Not correct. Pods that are not Ready still count as expected."
      - id: b
        text: "The budget is too strict."
        explanation: "Not correct. A strict budget still counts pods."
      - id: c
        text: "The cluster has no database."
        explanation: "Not correct. The database is not involved."
      - id: d
        text: "The selector matches no pods."
        explanation: "Correct. Take the labels from the StatefulSet."
    correct_option: d
    explanation: "Correct. Take the labels from the StatefulSet."

  - id: ats093-020-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a spread key"
    source_readings:
      - sections/section-020/module-03/course-02-spreading-the-pods.md
    prompt: "Which `topologyKey` spreads pods over nodes?"
    options:
      - id: a
        text: "`topology.kubernetes.io/zone`"
        explanation: "Not correct. That spreads over zones."
      - id: b
        text: "`node.kubernetes.io/instance-type`"
        explanation: "Not correct. That groups by machine type."
      - id: c
        text: "`app`"
        explanation: "Not correct. That is a label, not a topology key."
      - id: d
        text: "`kubernetes.io/hostname`"
        explanation: "Correct. Use the zone key to spread over zones."
    correct_option: d
    explanation: "Correct. Use the zone key to spread over zones."

  - id: ats093-020-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain preferred anti-affinity"
    source_readings:
      - sections/section-020/module-03/course-02-spreading-the-pods.md
    prompt: "What does `preferredDuringSchedulingIgnoredDuringExecution` do when no other node fits?"
    options:
      - id: a
        text: "The pod stays Pending."
        explanation: "Not correct. That is the `required` form."
      - id: b
        text: "The pod is deleted."
        explanation: "Not correct. Pods are not deleted by a preference."
      - id: c
        text: "The existing pod is evicted."
        explanation: "Not correct. Nothing is evicted."
      - id: d
        text: "The scheduler puts the pod on the same node."
        explanation: "Correct. The rule is a preference."
    correct_option: d
    explanation: "Correct. The rule is a preference."

  - id: ats093-020-q27
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the scale field"
    source_readings:
      - sections/section-020/module-03/course-03-scaling-keycloak.md
    prompt: "Which field does `kubectl scale keycloak keycloak --replicas=3` change?"
    options:
      - id: a
        text: "`spec.replicas`"
