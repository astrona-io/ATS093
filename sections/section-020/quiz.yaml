  - id: ats093-020-q29
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe a graceful stop"
    source_readings:
      - sections/section-020/module-03/course-04-graceful-shutdown-and-multi-site.md
    prompt: "What does Keycloak do when its pod receives the termination signal?"
    options:
      - id: a
        text: "It exits at once."
        explanation: "Not correct. It finishes its requests."
      - id: b
        text: "It waits for a new pod to take its sessions."
        explanation: "Not correct. It does not wait for a replacement."
      - id: c
        text: "It deletes its cache entries from the database."
        explanation: "Not correct. Sessions are in the database already."
      - id: d
        text: "It finishes the requests in progress and then exits."
        explanation: "Correct. If the grace period ends first, Kubernetes kills it."
    correct_option: d
    explanation: "Correct. If the grace period ends first, Kubernetes kills it."

  - id: ats093-020-q30
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the multi-site limit"
    source_readings:
      - sections/section-020/module-03/course-04-graceful-shutdown-and-multi-site.md
    prompt: "What does a multi-site design add to a single cluster?"
    options:
      - id: a
        text: "A larger heap on each pod."
        explanation: "Not correct. Heap size is unrelated."
      - id: b
        text: "A second operator in the same namespace."
        explanation: "Not correct. An operator does not give site failover."
      - id: c
        text: "A PodDisruptionBudget for each site."
        explanation: "Not correct. A budget covers one cluster."
      - id: d
        text: "An external Infinispan for state that must cross sites, and a tested failover."
        explanation: "Correct. The database must also work across sites."
    correct_option: d
    explanation: "Correct. The database must also work across sites."
