# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats093-010
course_id: ATS093
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Running Keycloak With The Keycloak Operator"
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
  - id: ats093-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what the Keycloak Operator is"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-manages.md
    prompt: "What is the Keycloak Operator?"
    options:
      - id: a
        text: "A controller that watches Keycloak custom resources and changes the cluster until it matches them."
        explanation: "Correct. The operator is a controller that reconciles objects to match the resources."
      - id: b
        text: "A command-line tool that installs Keycloak once and then exits."
        explanation: "Not correct. The operator keeps running as a Deployment and keeps reconciling."
      - id: c
        text: "A Keycloak realm that stores the settings of other realms."
        explanation: "Not correct. A realm is Keycloak data, not a controller."
      - id: d
        text: "A sidecar container inside every Keycloak pod."
        explanation: "Not correct. The operator runs as its own Deployment, not as a sidecar."
    correct_option: a
    explanation: "Correct. The operator is a controller that reconciles objects to match the resources."

  - id: ats093-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "State which namespace the operator watches"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-manages.md
    prompt: "The default operator install runs in the namespace `keycloak`. What happens to a `Keycloak` resource applied in another namespace?"
    options:
      - id: a
        text: "The operator creates a copy of it in the namespace `keycloak`."
        explanation: "Not correct. The operator never copies resources between namespaces."
      - id: b
        text: "The API server refuses the resource with a validation error."
        explanation: "Not correct. The resource is valid, so the API server accepts it."
      - id: c
        text: "The API server accepts it and the operator ignores it, with no error."
        explanation: "Correct. The default install watches only its own namespace."
      - id: d
        text: "The operator creates the StatefulSet in the other namespace."
        explanation: "Not correct. It does not watch that namespace, so it creates nothing."
    correct_option: c
    explanation: "Correct. The default install watches only its own namespace."

  - id: ats093-010-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why manual edits to operator-owned objects do not last"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-manages.md
    prompt: "You run `kubectl scale statefulset keycloak --replicas=2` while the `Keycloak` resource says `instances: 1`. What happens after a short time?"
    options:
      - id: a
        text: "The `instances` field in the `Keycloak` resource changes to 2."
        explanation: "Not correct. The operator never writes back into the resource spec."
      - id: b
        text: "The operator reconciles the StatefulSet back to one replica."
        explanation: "Correct. The operator owns the StatefulSet and restores it to match the resource."
      - id: c
        text: "The StatefulSet keeps two replicas and the operator reports an error."
        explanation: "Not correct. The operator changes the object back instead of reporting an error."
      - id: d
        text: "The operator is deleted because it lost control of the StatefulSet."
        explanation: "Not correct. Nothing deletes the operator."
    correct_option: b
    explanation: "Correct. The operator owns the StatefulSet and restores it to match the resource."

  - id: ats093-010-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Service clients use to reach Keycloak"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-manages.md
    prompt: "For a `Keycloak` resource named `keycloak`, which Service do clients use to reach the server?"
    options:
      - id: a
        text: "`keycloak-discovery`, on port 8080."
        explanation: "Not correct. That headless Service lets the instances find each other."
      - id: b
        text: "`keycloak-initial-admin`, on port 8080."
        explanation: "Not correct. That is a Secret, not a Service."
      - id: c
        text: "`keycloak-operator`, on port 8080."
        explanation: "Not correct. That is the operator Deployment, not a client address."
      - id: d
        text: "`keycloak-service`, the name of the resource plus `-service`."
        explanation: "Correct. The operator names the client Service after the resource."
    correct_option: d
    explanation: "Correct. The operator names the client Service after the resource."

  - id: ats093-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the status conditions of a Keycloak resource"
    source_readings:
      - sections/section-010/module-01/course-02-the-keycloak-custom-resource.md
    prompt: "A `Keycloak` resource shows `Ready=False`. What is the right next step?"
    options:
      - id: a
        text: "Delete the `Keycloak` resource and apply it again."
        explanation: "Not correct. That removes the evidence and does not find the cause."
      - id: b
        text: "Edit the StatefulSet to raise the replica count."
        explanation: "Not correct. The operator reverts StatefulSet edits, and replicas are not the cause."
      - id: c
        text: "Read the pod events and then the Keycloak log to find what is wrong."
        explanation: "Correct. The condition says something is wrong; the events and log say what."
      - id: d
        text: "Wait, because `Ready=False` always fixes itself."
        explanation: "Not correct. A pod that never became ready does not replace itself."
    correct_option: c
    explanation: "Correct. The condition says something is wrong; the events and log say what."

  - id: ats093-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep database credentials out of the Keycloak resource"
    source_readings:
      - sections/section-010/module-01/course-02-the-keycloak-custom-resource.md
    prompt: "How should a `Keycloak` resource supply the database password?"
    options:
      - id: a
        text: "With `db.passwordSecret`, which points at a key in a Kubernetes Secret."
        explanation: "Correct. The resource then holds no credential in plain text."
      - id: b
        text: "As a `password` entry in `additionalOptions`."
        explanation: "Not correct. It works but writes the password in plain text in the resource."
      - id: c
        text: "In `hostname.hostname`, after the host name."
        explanation: "Not correct. That field holds the public address, not credentials."
      - id: d
        text: "In `spec.unsupported.podTemplate` as an environment variable value."
        explanation: "Not correct. That field is unsupported and still stores the value in the resource."
    correct_option: a
    explanation: "Correct. The resource then holds no credential in plain text."

  - id: ats093-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recover a pod stuck after a configuration fix"
    source_readings:
      - sections/section-010/module-01/course-02-the-keycloak-custom-resource.md
    prompt: "You fixed a wrong Secret key in the `Keycloak` resource, but `keycloak-0` is still in `CreateContainerConfigError`. What do you do?"
    options:
      - id: a
        text: "Scale the StatefulSet to zero and back to one by hand."
        explanation: "Not correct. The operator reverts manual scaling."
      - id: b
        text: "Delete the Secret `keycloak-db` so it is created again."
        explanation: "Not correct. That removes the database credentials."
      - id: c
        text: "Set `ingress.enabled` to `true`."
        explanation: "Not correct. The Ingress setting has no effect on a container configuration error."
      - id: d
        text: "Delete the stuck pod so the StatefulSet creates it again from the fixed template."
        explanation: "Correct. The StatefulSet does not replace a pod that never became ready."
    correct_option: d
    explanation: "Correct. The StatefulSet does not replace a pod that never became ready."

  - id: ats093-010-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Say where the initial administrator credentials are stored"
    source_readings:
      - sections/section-010/module-01/course-02-the-keycloak-custom-resource.md
    prompt: "Where does the operator store the temporary administrator of the `master` realm?"
    options:
      - id: a
        text: "In the ConfigMap `keycloak-admin`, as plain text."
        explanation: "Not correct. The operator uses a Secret, not a ConfigMap."
      - id: b
        text: "In the Secret `keycloak-initial-admin`, with the keys `username` and `password`."
        explanation: "Correct. Read both values from that Secret."
      - id: c
        text: "In the `Keycloak` resource, under `spec.admin`."
        explanation: "Not correct. The resource does not hold administrator credentials."
      - id: d
        text: "In the operator log, printed at the first start."
        explanation: "Not correct. The operator does not log the password."
    correct_option: b
    explanation: "Correct. Read both values from that Secret."

  - id: ats093-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how a realm import works"
    source_readings:
      - sections/section-010/module-01/course-03-importing-realms.md
    prompt: "What does the operator do when you apply a `KeycloakRealmImport`?"
    options:
      - id: a
        text: "It starts a Kubernetes Job that runs Keycloak once against the database, imports the realm and stops."
        explanation: "Correct. The Job writes the realm into the database."
      - id: b
        text: "It sends the realm to the running pod through the Admin REST API."
        explanation: "Not correct. The operator uses a Job, not the Admin REST API."
      - id: c
        text: "It restarts all Keycloak pods with the realm as a startup argument."
        explanation: "Not correct. The running pods are not restarted."
      - id: d
        text: "It copies the realm into a ConfigMap that the pod mounts."
        explanation: "Not correct. The import writes to the database."
    correct_option: a
    explanation: "Correct. The Job writes the realm into the database."

  - id: ats093-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Know that an import never updates a realm"
    source_readings:
      - sections/section-010/module-01/course-03-importing-realms.md
    prompt: "The realm `warehouse` exists. You add a client to the `KeycloakRealmImport` for `warehouse` and apply it again. What happens to the realm?"
    options:
      - id: a
        text: "The new client is added and the other clients stay."
        explanation: "Not correct. The import never merges changes into an existing realm."
      - id: b
        text: "The realm is deleted and created again with the new client."
        explanation: "Not correct. An import never deletes a realm."
      - id: c
        text: "Nothing. An import only creates a realm that does not exist yet."
        explanation: "Correct. It never updates or deletes an existing realm."
      - id: d
        text: "The Job fails and the `Keycloak` resource turns `Ready=False`."
        explanation: "Not correct. The import leaves the realm alone and the Keycloak resource is not affected."
    correct_option: c
    explanation: "Correct. It never updates or deletes an existing realm."


  - id: ats093-010-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain request and limit"
    source_readings:
      - sections/section-010/module-02/course-01-resources-and-java-memory.md
    prompt: "What does the scheduler use to decide whether a pod fits on a node?"
    options:
      - id: a
        text: "The number of instances in the Keycloak resource."
        explanation: "Not correct. Each pod is placed on its own."
      - id: b
        text: "The resource request of the container."
        explanation: "Correct. The scheduler reserves the request and places the pod only on a node that has it free."
      - id: c
        text: "The memory limit of the container."
        explanation: "Not correct. The limit is enforced while the container runs, not when it is placed."
      - id: d
        text: "The size of the container image."
        explanation: "Not correct. Image size does not decide the placement."
    correct_option: b
    explanation: "Correct. The scheduler reserves the request and places the pod only on a node that has it free."

  - id: ats093-010-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Link the heap to the memory limit"
    source_readings:
      - sections/section-010/module-02/course-01-resources-and-java-memory.md
    prompt: "How does the Keycloak container size the Java heap by default?"
    options:
      - id: a
        text: "As a percentage of the container memory limit."
        explanation: "Correct. The maximum heap is about 70 percent of the limit."
      - id: b
        text: "As a fixed 512 MiB."
        explanation: "Not correct. The size follows the limit, not a fixed number."
      - id: c
        text: "As the memory request of the pod."
        explanation: "Not correct. The request only affects scheduling."
      - id: d
        text: "As half of the node memory, whatever the limit."
        explanation: "Not correct. A limit changes the heap size, and without one the JVM looks at the node."
    correct_option: a
    explanation: "Correct. The maximum heap is about 70 percent of the limit."

  - id: ats093-010-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a kill reason"
    source_readings:
      - sections/section-010/module-02/course-01-resources-and-java-memory.md
    prompt: "`kubectl describe pod` shows the last state `OOMKilled` with exit code 137. What does this mean?"
    options:
      - id: a
        text: "The node ran out of disk space."
        explanation: "Not correct. Disk pressure gives a different reason."
      - id: b
        text: "The readiness probe failed too often."
        explanation: "Not correct. A failed probe restarts the container with a different reason."
      - id: c
        text: "The operator deleted the pod."
        explanation: "Not correct. The operator does not use this reason."
      - id: d
        text: "The container went over its memory limit and the kernel ended it."
        explanation: "Correct. OOMKilled is the kernel ending a container above its memory limit."
    correct_option: d
    explanation: "Correct. OOMKilled is the kernel ending a container above its memory limit."

  - id: ats093-010-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Diagnose a Pending pod"
    source_readings:
      - sections/section-010/module-02/course-01-resources-and-java-memory.md
    prompt: "A Keycloak pod stays `Pending` and the Keycloak resource looks valid. Where is the reason?"
    options:
      - id: a
        text: "In the realm settings."
        explanation: "Not correct. A realm cannot influence scheduling."
      - id: b
        text: "In the PostgreSQL log."
        explanation: "Not correct. The database is not involved in placement."
      - id: c
        text: "In the events of the pod."
        explanation: "Correct. The scheduler records why it could not place the pod in the pod events."
      - id: d
        text: "In the Keycloak log."
        explanation: "Not correct. The container never started, so there is no Keycloak log."
    correct_option: c
    explanation: "Correct. The scheduler records why it could not place the pod in the pod events."

  - id: ats093-010-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a spread mode"
    source_readings:
      - sections/section-010/module-02/course-02-scheduling-and-priority.md
    prompt: "Which setting lets a pod start even when a topology spread constraint cannot be met?"
    options:
      - id: a
        text: "`topologyKey: none`"
        explanation: "Not correct. The key must name a node label."
      - id: b
        text: "`whenUnsatisfiable: ScheduleAnyway`"
        explanation: "Correct. ScheduleAnyway only prefers an even spread."
      - id: c
        text: "`whenUnsatisfiable: DoNotSchedule`"
        explanation: "Not correct. DoNotSchedule leaves the pod Pending."
      - id: d
        text: "`maxSkew: 0`"
        explanation: "Not correct. A skew of zero is stricter."
    correct_option: b
    explanation: "Correct. ScheduleAnyway only prefers an even spread."

  - id: ats093-010-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain tolerations"
    source_readings:
      - sections/section-010/module-02/course-02-scheduling-and-priority.md
    prompt: "What does a toleration in `scheduling.tolerations` do?"
    options:
      - id: a
        text: "It allows the pod to run on a node with a matching taint."
        explanation: "Correct. A toleration only permits the node; it does not choose it."
      - id: b
        text: "It forces the pod onto a node with a matching taint."
        explanation: "Not correct. Use node affinity to require a node."
      - id: c
        text: "It removes the taint from the node."
        explanation: "Not correct. The node keeps its taint."
      - id: d
        text: "It gives the pod a higher priority."
        explanation: "Not correct. Priority comes from the priority class."
    correct_option: a
    explanation: "Correct. A toleration only permits the node; it does not choose it."

  - id: ats093-010-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the option format"
    source_readings:
      - sections/section-010/module-02/course-03-server-options-and-secrets.md
    prompt: "How do you write the option `--log-level` as an entry in `additionalOptions`?"
    options:
      - id: a
        text: "`name: --log-level`"
        explanation: "Not correct. Leave out the dashes."
      - id: b
        text: "`name: KC_LOG_LEVEL`"
        explanation: "Not correct. The operator creates the environment variable name itself."
      - id: c
        text: "`name: logLevel`"
        explanation: "Not correct. The name stays in the Keycloak spelling."
      - id: d
        text: "`name: log-level`"
        explanation: "Correct. The name is the command-line name without dashes."
    correct_option: d
    explanation: "Correct. The name is the command-line name without dashes."

  - id: ats093-010-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep a password out of the resource"
    source_readings:
      - sections/section-010/module-02/course-03-server-options-and-secrets.md
    prompt: "How does an `additionalOptions` entry read its value from a Secret?"
    options:
      - id: a
        text: "With `valueFrom` and `configMapKeyRef`."
        explanation: "Not correct. A ConfigMap is not a place for a password."
      - id: b
        text: "It cannot; only plain values are possible."
        explanation: "Not correct. The secret reference exists for this purpose."
      - id: c
        text: "With `secret` holding `name` and `key`, instead of `value`."
        explanation: "Correct. The operator adds an environment variable that reads the Secret key."
      - id: d
        text: "With `value: secret://name/key`."
        explanation: "Not correct. There is no such URL syntax."
    correct_option: c
    explanation: "Correct. The operator adds an environment variable that reads the Secret key."

  - id: ats093-010-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an optimized image"
    source_readings:
      - sections/section-010/module-02/course-04-pod-template-and-custom-images.md
    prompt: "You built a custom image with `kc.sh build`. Which field tells the operator to skip the build at start?"
    options:
      - id: a
        text: "`unsupported.optimized: true`"
        explanation: "Not correct. There is no such field."
      - id: b
        text: "`startOptimized: true`"
        explanation: "Correct. The operator then starts Keycloak with the optimized option."
      - id: c
        text: "`image: optimized`"
        explanation: "Not correct. The image field holds the image name."
      - id: d
        text: "`instances: 0`"
        explanation: "Not correct. This only stops all pods."
    correct_option: b
    explanation: "Correct. The operator then starts Keycloak with the optimized option."

  - id: ats093-010-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "State the status of the pod template"
    source_readings:
      - sections/section-010/module-02/course-04-pod-template-and-custom-images.md
    prompt: "Why is `unsupported.podTemplate` called unsupported?"
    options:
      - id: a
        text: "A later operator version can change the generated template, and the merge can break."
        explanation: "Correct. The project does not support deployments that depend on the merge."
      - id: b
        text: "It only works on OpenShift."
        explanation: "Not correct. It is not limited to one platform."
      - id: c
        text: "It is removed in Keycloak 26."
        explanation: "Not correct. The field exists in 26.8."
      - id: d
        text: "It cannot change any field."
        explanation: "Not correct. It can change many fields."
    correct_option: a
    explanation: "Correct. The project does not support deployments that depend on the merge."

  - id: ats093-010-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what an import creates"
    source_readings:
      - sections/section-010/module-03/course-01-how-a-realm-import-works.md
    prompt: "What does the operator create when a `KeycloakRealmImport` is applied?"
    options:
      - id: a
        text: "A StatefulSet that holds the realm."
        explanation: "Not correct. The realm lives in the database."
      - id: b
        text: "A new Keycloak instance for the realm."
        explanation: "Not correct. The import uses the existing Keycloak."
      - id: c
        text: "A ConfigMap that Keycloak reads at every start."
        explanation: "Not correct. The realm is stored in the database, not read from a ConfigMap."
      - id: d
        text: "A Job that runs Keycloak once to import the realm."
        explanation: "Correct. The Job writes the realm into the database and stops."
    correct_option: d
    explanation: "Correct. The Job writes the realm into the database and stops."

  - id: ats093-010-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of editing an import"
    source_readings:
      - sections/section-010/module-03/course-01-how-a-realm-import-works.md
    prompt: "The realm already exists. You change `accessTokenLifespan` in the `KeycloakRealmImport` and apply it. What happens to the realm?"
    options:
      - id: a
        text: "The operator updates the realm."
        explanation: "Not correct. The operator does not update realms."
      - id: b
        text: "The operator deletes and recreates the realm."
        explanation: "Not correct. The operator never deletes realm data."
      - id: c
        text: "Keycloak applies the change at the next restart."
        explanation: "Not correct. A restart does not rerun the import with new values."
      - id: d
        text: "Nothing; an import skips a realm that exists."
        explanation: "Correct. The import never updates an existing realm."
    correct_option: d
    explanation: "Correct. The import never updates an existing realm."

  - id: ats093-010-q23
    type: single_choice
    difficulty: beginner
    learning_objective: "Find a failed import cause"
    source_readings:
      - sections/section-010/module-03/course-01-how-a-realm-import-works.md
    prompt: "A `KeycloakRealmImport` shows `HasErrors=True`. Where is the cause?"
    options:
      - id: a
        text: "In the realm settings of the master realm."
        explanation: "Not correct. The master realm does not hold import errors."
      - id: b
        text: "In the PostgreSQL configuration."
        explanation: "Not correct. The database is not where the import reports."
      - id: c
        text: "In the Keycloak ingress."
        explanation: "Not correct. The ingress does not take part in the import."
      - id: d
        text: "In the log of the import Job pod."
        explanation: "Correct. The condition message is short; the Job log has the exception."
    correct_option: d
    explanation: "Correct. The condition message is short; the Job log has the exception."

  - id: ats093-010-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use kcadm against a live realm"
    source_readings:
      - sections/section-010/module-03/course-02-changing-a-realm-that-exists.md
    prompt: "Which option of `kcadm.sh` selects the realm to work on?"
    options:
      - id: a
        text: "`-n`"
        explanation: "Not correct. `-n` is not the realm option."
      - id: b
        text: "`--realm-id`"
        explanation: "Not correct. There is no such option."
      - id: c
        text: "`-s`"
        explanation: "Not correct. `-s` sets a field."
      - id: d
        text: "`-r`"
        explanation: "Correct. Without `-r` the command works on the master realm."
    correct_option: d
    explanation: "Correct. Without `-r` the command works on the master realm."

  - id: ats093-010-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Look up a client"
    source_readings:
      - sections/section-010/module-03/course-02-changing-a-realm-that-exists.md
    prompt: "You want to update a client. What does the Admin REST API path use to identify it?"
    options:
      - id: a
        text: "The client ID."
        explanation: "Not correct. The client ID is a search field, not the path key."
      - id: b
        text: "The display name."
        explanation: "Not correct. The display name is not unique."
      - id: c
        text: "The redirect URI."
        explanation: "Not correct. A redirect URI does not identify a client."
      - id: d
        text: "The UUID of the client."
        explanation: "Correct. Look it up first with `-q clientId=...`."
    correct_option: d
    explanation: "Correct. Look it up first with `-q clientId=...`."

  - id: ats093-010-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a partial import rule"
    source_readings:
      - sections/section-010/module-03/course-02-changing-a-realm-that-exists.md
    prompt: "You want to add clients that are missing and leave existing clients unchanged. Which `ifResourceExists` value fits?"
    options:
      - id: a
        text: "`OVERWRITE`"
        explanation: "Not correct. OVERWRITE replaces them."
      - id: b
        text: "`FAIL`"
        explanation: "Not correct. FAIL stops with an error."
      - id: c
        text: "`MERGE`"
        explanation: "Not correct. MERGE is not a value."
      - id: d
        text: "`SKIP`"
        explanation: "Correct. SKIP keeps existing entries."
    correct_option: d
    explanation: "Correct. SKIP keeps existing entries."

  - id: ats093-010-q27
