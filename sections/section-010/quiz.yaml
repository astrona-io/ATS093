  - id: ats093-010-q28
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep a client secret out of the resource"
    source_readings:
      - sections/section-010/module-03/course-03-client-resources.md
    prompt: "How does a `KeycloakOIDCClient` get its client secret without writing it into the resource?"
    options:
      - id: a
        text: "With a placeholder in `spec.placeholders`."
        explanation: "Not correct. Placeholders belong to the realm import."
      - id: b
        text: "With the environment variable `KC_CLIENT_SECRET`."
        explanation: "Not correct. That variable does not exist."
      - id: c
        text: "It cannot; the secret is always in the resource."
        explanation: "Not correct. A secret reference exists for this."
      - id: d
        text: "With `client.auth.secretRef` that points at a Secret key."
        explanation: "Correct. The secret stays in a Kubernetes Secret."
    correct_option: d
    explanation: "Correct. The secret stays in a Kubernetes Secret."

  - id: ats093-010-q29
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain placeholders"
    source_readings:
      - sections/section-010/module-03/course-04-configuration-across-environments.md
    prompt: "What do `spec.placeholders` of a `KeycloakRealmImport` do?"
    options:
      - id: a
        text: "They create the Secrets of the realm."
        explanation: "Not correct. The Secret must already exist."
      - id: b
        text: "They list the realms to import."
        explanation: "Not correct. Realms are set in `spec.realm`."
      - id: c
        text: "They encrypt the realm file."
        explanation: "Not correct. Placeholders only substitute values."
      - id: d
        text: "They replace `${NAME}` in the realm with a value from a Secret."
        explanation: "Correct. The Job reads the values as environment variables."
    correct_option: d
    explanation: "Correct. The Job reads the values as environment variables."

  - id: ats093-010-q30
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define drift"
    source_readings:
      - sections/section-010/module-03/course-04-configuration-across-environments.md
    prompt: "What is drift?"
    options:
      - id: a
        text: "A pod that moves to another node."
        explanation: "Not correct. That is scheduling."
      - id: b
        text: "A token that expires early."
        explanation: "Not correct. That is token lifetime."
      - id: c
        text: "A delay between two Keycloak instances."
        explanation: "Not correct. That is cache replication."
      - id: d
        text: "The difference between the definition in Git and the live realm."
        explanation: "Correct. It grows with manual changes, because the import never corrects it."
    correct_option: d
    explanation: "Correct. It grows with manual changes, because the import never corrects it."
