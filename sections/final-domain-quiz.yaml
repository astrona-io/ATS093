# Final domain knowledge check across all five sections: three questions from every module.
schema_version: 1
kind: question_bank
id: ats093-final
course_id: ATS093
exam_code: KEYCLOAK
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: production-operations-security-kubernetes
  title: "Production Operations, Security & Kubernetes"
placement:
  position: after
  reading: sections/section-050/capstone/labs/lab-01/question.md
questions:

  - id: ats093-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "State which namespace the operator watches"
    source_readings:
      - sections/section-010/module-01/course-01-what-the-operator-manages.md
    prompt: "The default operator install runs in the namespace `keycloak`. What happens to a `Keycloak` resource applied in another namespace?"
    options:
      - id: a
        text: "The operator creates a copy of it in the namespace `keycloak`."
        explanation: "Not correct. The operator never copies resources between namespaces."
      - id: b
        text: "The API server refuses the resource with a validation error."
        explanation: "Not correct. The resource is valid, so the API server accepts it."
      - id: c
        text: "The API server accepts it and the operator ignores it, with no error."
        explanation: "Correct. The default install watches only its own namespace."
      - id: d
        text: "The operator creates the StatefulSet in the other namespace."
        explanation: "Not correct. It does not watch that namespace, so it creates nothing."
    correct_option: c
    explanation: "Correct. The default install watches only its own namespace."

  - id: ats093-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep database credentials out of the Keycloak resource"
    source_readings:
      - sections/section-010/module-01/course-02-the-keycloak-custom-resource.md
    prompt: "How should a `Keycloak` resource supply the database password?"
    options:
      - id: a
        text: "With `db.passwordSecret`, which points at a key in a Kubernetes Secret."
        explanation: "Correct. The resource then holds no credential in plain text."
      - id: b
        text: "As a `password` entry in `additionalOptions`."
        explanation: "Not correct. It works but writes the password in plain text in the resource."
      - id: c
        text: "In `hostname.hostname`, after the host name."
        explanation: "Not correct. That field holds the public address, not credentials."
      - id: d
        text: "In `spec.unsupported.podTemplate` as an environment variable value."
        explanation: "Not correct. That field is unsupported and still stores the value in the resource."
    correct_option: a
    explanation: "Correct. The resource then holds no credential in plain text."

  - id: ats093-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how a realm import works"
    source_readings:
      - sections/section-010/module-01/course-03-importing-realms.md
    prompt: "What does the operator do when you apply a `KeycloakRealmImport`?"
    options:
      - id: a
        text: "It starts a Kubernetes Job that runs Keycloak once against the database, imports the realm and stops."
        explanation: "Correct. The Job writes the realm into the database."
      - id: b
        text: "It sends the realm to the running pod through the Admin REST API."
        explanation: "Not correct. The operator uses a Job, not the Admin REST API."
      - id: c
        text: "It restarts all Keycloak pods with the realm as a startup argument."
        explanation: "Not correct. The running pods are not restarted."
      - id: d
        text: "It copies the realm into a ConfigMap that the pod mounts."
        explanation: "Not correct. The import writes to the database."
    correct_option: a
    explanation: "Correct. The Job writes the realm into the database."

  - id: ats093-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Link the heap to the memory limit"
    source_readings:
      - sections/section-010/module-02/course-01-resources-and-java-memory.md
    prompt: "How does the Keycloak container size the Java heap by default?"
    options:
      - id: a
        text: "As a percentage of the container memory limit."
        explanation: "Correct. The maximum heap is about 70 percent of the limit."
      - id: b
        text: "As a fixed 512 MiB."
        explanation: "Not correct. The size follows the limit, not a fixed number."
      - id: c
        text: "As the memory request of the pod."
        explanation: "Not correct. The request only affects scheduling."
      - id: d
        text: "As half of the node memory, whatever the limit."
        explanation: "Not correct. A limit changes the heap size, and without one the JVM looks at the node."
    correct_option: a
    explanation: "Correct. The maximum heap is about 70 percent of the limit."

  - id: ats093-final-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain tolerations"
    source_readings:
      - sections/section-010/module-02/course-02-scheduling-and-priority.md
    prompt: "What does a toleration in `scheduling.tolerations` do?"
    options:
      - id: a
        text: "It allows the pod to run on a node with a matching taint."
        explanation: "Correct. A toleration only permits the node; it does not choose it."
      - id: b
        text: "It forces the pod onto a node with a matching taint."
        explanation: "Not correct. Use node affinity to require a node."
      - id: c
        text: "It removes the taint from the node."
        explanation: "Not correct. The node keeps its taint."
      - id: d
        text: "It gives the pod a higher priority."
        explanation: "Not correct. Priority comes from the priority class."
    correct_option: a
    explanation: "Correct. A toleration only permits the node; it does not choose it."

  - id: ats093-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an optimized image"
    source_readings:
      - sections/section-010/module-02/course-04-pod-template-and-custom-images.md
    prompt: "You built a custom image with `kc.sh build`. Which field tells the operator to skip the build at start?"
    options:
      - id: a
        text: "`unsupported.optimized: true`"
        explanation: "Not correct. There is no such field."
      - id: b
        text: "`startOptimized: true`"
        explanation: "Correct. The operator then starts Keycloak with the optimized option."
      - id: c
        text: "`image: optimized`"
        explanation: "Not correct. The image field holds the image name."
      - id: d
        text: "`instances: 0`"
        explanation: "Not correct. This only stops all pods."
    correct_option: b
    explanation: "Correct. The operator then starts Keycloak with the optimized option."

  - id: ats093-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of editing an import"
    source_readings:
      - sections/section-010/module-03/course-01-how-a-realm-import-works.md
    prompt: "The realm already exists. You change `accessTokenLifespan` in the `KeycloakRealmImport` and apply it. What happens to the realm?"
    options:
      - id: a
        text: "The operator updates the realm."
        explanation: "Not correct. The operator does not update realms."
      - id: b
        text: "The operator deletes and recreates the realm."
        explanation: "Not correct. The operator never deletes realm data."
      - id: c
        text: "Keycloak applies the change at the next restart."
        explanation: "Not correct. A restart does not rerun the import with new values."
      - id: d
        text: "Nothing; an import skips a realm that exists."
        explanation: "Correct. The import never updates an existing realm."
    correct_option: d
    explanation: "Correct. The import never updates an existing realm."

  - id: ats093-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a partial import rule"
    source_readings:
      - sections/section-010/module-03/course-02-changing-a-realm-that-exists.md
    prompt: "You want to add clients that are missing and leave existing clients unchanged. Which `ifResourceExists` value fits?"
    options:
      - id: a
        text: "`OVERWRITE`"
        explanation: "Not correct. OVERWRITE replaces them."
      - id: b
        text: "`FAIL`"
        explanation: "Not correct. FAIL stops with an error."
      - id: c
        text: "`MERGE`"
        explanation: "Not correct. MERGE is not a value."
      - id: d
        text: "`SKIP`"
        explanation: "Correct. SKIP keeps existing entries."
    correct_option: d
    explanation: "Correct. SKIP keeps existing entries."

  - id: ats093-final-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain placeholders"
    source_readings:
      - sections/section-010/module-03/course-04-configuration-across-environments.md
    prompt: "What do `spec.placeholders` of a `KeycloakRealmImport` do?"
    options:
      - id: a
        text: "They create the Secrets of the realm."
        explanation: "Not correct. The Secret must already exist."
      - id: b
        text: "They list the realms to import."
        explanation: "Not correct. Realms are set in `spec.realm`."
      - id: c
        text: "They encrypt the realm file."
        explanation: "Not correct. Placeholders only substitute values."
      - id: d
        text: "They replace `${NAME}` in the realm with a value from a Secret."
        explanation: "Correct. The Job reads the values as environment variables."
    correct_option: d
    explanation: "Correct. The Job reads the values as environment variables."

  - id: ats093-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why sessions survive a full restart"
    source_readings:
      - sections/section-020/module-01/course-01-the-database-is-the-source-of-truth.md
    prompt: "All Keycloak pods are deleted and then start again. Why can alice still use her refresh token?"
    options:
      - id: a
        text: "The refresh token is valid forever and needs no session."
        explanation: "Not correct. Keycloak accepts a refresh token only while the session exists."
      - id: b
        text: "The StatefulSet keeps the memory of the deleted pods."
        explanation: "Not correct. The memory of a deleted pod is gone."
      - id: c
        text: "The tester pod stores the session for Keycloak."
        explanation: "Not correct. The tester pod is only a client."
      - id: d
        text: "Her session is stored in PostgreSQL, and Keycloak reads it back."
        explanation: "Correct. Persistent user sessions live in the database."
    correct_option: d
    explanation: "Correct. Persistent user sessions live in the database."

  - id: ats093-final-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the default cache mode in production"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Which value of the `cache` option gives each pod private caches and no cluster?"
    options:
      - id: a
        text: "`ispn`"
        explanation: "Not correct. `ispn` is the clustered mode that the operator uses."
      - id: b
        text: "`local`"
        explanation: "Correct. It is the default only in development mode."
      - id: c
        text: "`jdbc-ping`"
        explanation: "Not correct. That is a cache stack for discovery, not a cache mode."
      - id: d
        text: "`distributed`"
        explanation: "Not correct. That is not a value of the `cache` option."
    correct_option: b
    explanation: "Correct. It is the default only in development mode."

  - id: ats093-final-q12
    type: single_choice
    difficulty: advanced
    learning_objective: "Find the best proof of a cluster"
    source_readings:
      - sections/section-020/module-01/course-02-infinispan-caches-and-discovery.md
    prompt: "Two pods are `Running` and ready. What is the most reliable proof that they form one cluster?"
    options:
      - id: a
        text: "`kubectl get pods` shows two pods as `Ready`."
        explanation: "Not correct. Two ready pods can be two separate servers."
      - id: b
        text: "The metric `vendor_cluster_size` equals the number of instances on every pod."
        explanation: "Correct. A pod that runs alone reports 1."
      - id: c
        text: "A token from one pod is accepted by the other."
        explanation: "Not correct. Sessions and keys come from the database, so this works without a cluster."
      - id: d
        text: "The `Keycloak` resource reports `Ready=True`."
        explanation: "Not correct. It reports readiness, not membership."
    correct_option: b
    explanation: "Correct. A pod that runs alone reports 1."

  - id: ats093-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Build a cache option name"
    source_readings:
      - sections/section-020/module-02/course-01-cache-types-and-limits.md
    prompt: "Which option bounds the cache `offlineSessions`?"
    options:
      - id: a
        text: "`spi-cache-embedded--offline--max`"
        explanation: "Not correct. That is not a cache option."
      - id: b
        text: "`cache-embedded-offline-sessions-max-count`"
        explanation: "Correct. The cache name is lower case with dashes."
      - id: c
        text: "`cache-embedded-offlineSessions-max-count`"
        explanation: "Not correct. The name is not written in camel case."
      - id: d
        text: "`cache-offline-sessions-limit`"
        explanation: "Not correct. That option does not exist."
    correct_option: b
    explanation: "Correct. The cache name is lower case with dashes."

  - id: ats093-final-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain persistent user sessions"
    source_readings:
      - sections/section-020/module-02/course-02-sessions-in-memory-and-in-the-database.md
    prompt: "With persistent user sessions, where is the source of truth for a user session?"
    options:
      - id: a
        text: "The browser cookie."
        explanation: "Not correct. The cookie only points at the session."
      - id: b
        text: "The database."
        explanation: "Correct. The caches are loaded on demand."
      - id: c
        text: "The `sessions` cache."
        explanation: "Not correct. The cache is a copy."
      - id: d
        text: "The pod that created it."
        explanation: "Not correct. Other pods read the session as well."
    correct_option: b
    explanation: "Correct. The caches are loaded on demand."

  - id: ats093-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the discovery of the default stack"
    source_readings:
      - sections/section-020/module-02/course-03-cluster-transport-and-its-security.md
    prompt: "How do pods discover each other with the default `jdbc-ping` stack?"
    options:
      - id: a
        text: "They read a ConfigMap."
        explanation: "Not correct. No ConfigMap is involved."
      - id: b
        text: "They register in a table of the Keycloak database."
        explanation: "Correct. No extra service is needed."
      - id: c
        text: "They use IP multicast."
        explanation: "Not correct. Multicast is for the deprecated stacks."
      - id: d
        text: "They query the Kubernetes API."
        explanation: "Not correct. The kubernetes stack uses DNS and is deprecated."
    correct_option: b
    explanation: "Correct. No extra service is needed."

  - id: ats093-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a budget"
    source_readings:
      - sections/section-020/module-03/course-01-planned-and-unplanned-disruption.md
    prompt: "Two Keycloak pods, budget `minAvailable: 2`. What does `ALLOWED DISRUPTIONS` show?"
    options:
      - id: a
        text: "1"
        explanation: "Not correct. That would leave one pod."
      - id: b
        text: "2"
        explanation: "Not correct. Two pods are the whole set."
      - id: c
        text: "Unlimited"
        explanation: "Not correct. The budget limits it."
      - id: d
        text: "0"
        explanation: "Correct. Evicting a pod would go below the minimum."
    correct_option: d
    explanation: "Correct. Evicting a pod would go below the minimum."

  - id: ats093-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain preferred anti-affinity"
    source_readings:
      - sections/section-020/module-03/course-02-spreading-the-pods.md
    prompt: "What does `preferredDuringSchedulingIgnoredDuringExecution` do when no other node fits?"
    options:
      - id: a
        text: "The pod stays Pending."
        explanation: "Not correct. That is the `required` form."
      - id: b
        text: "The pod is deleted."
        explanation: "Not correct. Pods are not deleted by a preference."
      - id: c
        text: "The existing pod is evicted."
        explanation: "Not correct. Nothing is evicted."
      - id: d
        text: "The scheduler puts the pod on the same node."
        explanation: "Correct. The rule is a preference."
    correct_option: d
    explanation: "Correct. The rule is a preference."

  - id: ats093-final-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe a graceful stop"
    source_readings:
      - sections/section-020/module-03/course-04-graceful-shutdown-and-multi-site.md
    prompt: "What does Keycloak do when its pod receives the termination signal?"
    options:
      - id: a
        text: "It exits at once."
        explanation: "Not correct. It finishes its requests."
      - id: b
        text: "It waits for a new pod to take its sessions."
        explanation: "Not correct. It does not wait for a replacement."
      - id: c
        text: "It deletes its cache entries from the database."
        explanation: "Not correct. Sessions are in the database already."
      - id: d
        text: "It finishes the requests in progress and then exits."
        explanation: "Correct. If the grace period ends first, Kubernetes kills it."
    correct_option: d
    explanation: "Correct. If the grace period ends first, Kubernetes kills it."

  - id: ats093-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right setting for passthrough"
    source_readings:
      - sections/section-030/module-01/course-01-tls-termination-and-proxy-headers.md
    prompt: "A proxy passes the TLS connection to Keycloak without reading it. Which setting do you use?"
    options:
      - id: a
        text: "`proxy-protocol-enabled=true` and no `proxy-headers`."
        explanation: "Correct. The proxy cannot add headers to a stream it does not read."
      - id: b
        text: "`proxy-headers=xforwarded`."
        explanation: "Not correct. The proxy cannot add headers to an encrypted stream."
      - id: c
        text: "`http-enabled=true` and `proxy-headers=forwarded`."
        explanation: "Not correct. Those settings are for edge termination."
      - id: d
        text: "`hostname-strict=false` only."
        explanation: "Not correct. That does not tell Keycloak about the client connection."
    correct_option: a
    explanation: "Correct. The proxy cannot add headers to a stream it does not read."

  - id: ats093-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Block the master realm as well as the console"
    source_readings:
      - sections/section-030/module-01/course-02-what-to-expose.md
    prompt: "You block `/admin/` at the proxy and nothing else. What is still exposed?"
    options:
      - id: a
        text: "Nothing, because the console is the only administrative path."
        explanation: "Not correct. The master realm's endpoints stay public."
      - id: b
        text: "Only the `/metrics` endpoint on port 9000."
        explanation: "Not correct. The proxy forwards port 8080, not the management port."
      - id: c
        text: "The sign-in and token endpoints of the `master` realm, where administrator accounts can be attacked."
        explanation: "Correct. Block `/realms/master/` too."
      - id: d
        text: "Only the static files under `/resources/`."
        explanation: "Not correct. Those are meant to be public."
    correct_option: c
    explanation: "Correct. Block `/realms/master/` too."

  - id: ats093-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a lockout type"
    source_readings:
      - sections/section-030/module-01/course-03-brute-force-and-rate-limiting.md
    prompt: "Why is a temporary lockout usually better than a permanent one?"
    options:
      - id: a
        text: "A permanent lockout is slower to check."
        explanation: "Not correct. Speed is not the reason."
      - id: b
        text: "A temporary lockout resets the password of the user."
        explanation: "Not correct. A lockout never changes the password."
      - id: c
        text: "With a permanent lockout, anyone who knows a user name can lock that user out for good."
        explanation: "Correct. A temporary lockout ends on its own."
      - id: d
        text: "A permanent lockout works only with a rate limit."
        explanation: "Not correct. The two features are independent."
    correct_option: c
    explanation: "Correct. A temporary lockout ends on its own."

  - id: ats093-final-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the risk of hostname-strict false"
    source_readings:
      - sections/section-030/module-02/course-01-the-hostname-options.md
    prompt: "What is the risk of `hostname-strict=false`?"
    options:
      - id: a
        text: "Cache entries are lost."
        explanation: "Not correct. Caches are unrelated."
      - id: b
        text: "Host header injection into generated URLs."
        explanation: "Correct. Use it only if the proxy overwrites the headers."
      - id: c
        text: "Tokens are no longer signed."
        explanation: "Not correct. Signing is unrelated."
      - id: d
        text: "The database connection is unencrypted."
        explanation: "Not correct. The database is unrelated."
    correct_option: b
    explanation: "Correct. Use it only if the proxy overwrites the headers."

  - id: ats093-final-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply a Secret that exists"
    source_readings:
      - sections/section-030/module-02/course-02-certificates-and-trust.md
    prompt: "`kubectl create secret tls edge-tls` fails because the Secret exists. What replaces it?"
    options:
      - id: a
        text: "`kubectl patch keycloak`"
        explanation: "Not correct. The Keycloak resource is not the Secret."
      - id: b
        text: "Render with `--dry-run=client -o yaml` and apply."
        explanation: "Correct. `kubectl apply` updates the Secret."
      - id: c
        text: "`kubectl delete namespace`"
        explanation: "Not correct. That deletes everything."
      - id: d
        text: "`kubectl rollout undo`"
        explanation: "Not correct. That is for Deployments."
    correct_option: b
    explanation: "Correct. `kubectl apply` updates the Secret."

  - id: ats093-final-q24
    type: single_choice
    difficulty: advanced
    learning_objective: "Secure a certificate header"
    source_readings:
      - sections/section-030/module-02/course-03-mutual-tls-and-client-certificates.md
    prompt: "What must a proxy do when it passes the client certificate in a header?"
    options:
      - id: a
        text: "Send it over plain HTTP."
        explanation: "Not correct. The network must also be restricted."
      - id: b
        text: "Overwrite the header on every request."
        explanation: "Correct. Otherwise a client can forge it."
      - id: c
        text: "Pass the header the client sent."
        explanation: "Not correct. A client could forge the certificate."
      - id: d
        text: "Encode it in base64 only."
        explanation: "Not correct. Encoding is not protection."
    correct_option: b
    explanation: "Correct. Otherwise a client can forge it."

  - id: ats093-final-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the strongest rule"
    source_readings:
      - sections/section-030/module-03/course-01-password-and-account-policies.md
    prompt: "Which rule gives the most protection per rule in current guidance?"
    options:
      - id: a
        text: "Forced rotation every 30 days."
        explanation: "Not correct. Rotation leads to predictable changes."
      - id: b
        text: "Requiring one symbol."
        explanation: "Not correct. Symbols add little."
      - id: c
        text: "Banning vowels."
        explanation: "Not correct. This is not a rule."
      - id: d
        text: "A minimum length."
        explanation: "Correct. Length beats character classes."
    correct_option: d
    explanation: "Correct. Length beats character classes."

  - id: ats093-final-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain refresh token revocation"
    source_readings:
      - sections/section-030/module-03/course-02-sessions-tokens-and-events.md
    prompt: "What does `revokeRefreshToken=true` change?"
    options:
      - id: a
        text: "Access tokens last longer."
        explanation: "Not correct. Lifespans are separate."
      - id: b
        text: "Sessions never expire."
        explanation: "Not correct. Expiry is separate."
      - id: c
        text: "Offline tokens are deleted."
        explanation: "Not correct. Offline tokens are separate."
      - id: d
        text: "Each refresh token can be used once."
        explanation: "Correct. A replay ends the session."
    correct_option: d
    explanation: "Correct. A replay ends the session."

  - id: ats093-final-q27
    type: single_choice
    difficulty: intermediate
    learning_objective: "Protect the management port"
    source_readings:
      - sections/section-030/module-03/course-03-the-server-and-the-administrator.md
    prompt: "Where should the management port 9000 be reachable?"
    options:
      - id: a
        text: "From the internet through the proxy."
        explanation: "Not correct. It exposes health and metrics."
      - id: b
        text: "From every namespace."
        explanation: "Not correct. Restrict it."
      - id: c
        text: "Only from the database."
        explanation: "Not correct. The database does not need it."
      - id: d
        text: "Only by the monitoring system, through a network policy."
        explanation: "Correct. Keep it off the public path."
    correct_option: d
    explanation: "Correct. Keep it off the public path."

  - id: ats093-final-q28
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say why a realm export is not a backup"
    source_readings:
      - sections/section-040/module-01/course-01-what-to-back-up.md
    prompt: "Why is the partial realm export from the Admin Console not a backup?"
    options:
      - id: a
        text: "It is encrypted and cannot be read again."
        explanation: "Not correct. It is plain JSON."
      - id: b
        text: "It leaves out the users and replaces every secret with `*` characters."
        explanation: "Correct. It is configuration, not data."
      - id: c
        text: "It includes sessions but not realm settings."
        explanation: "Not correct. It includes settings and no sessions."
      - id: d
        text: "It can only be taken when Keycloak is stopped."
        explanation: "Not correct. The Admin Console export works on a running server."
    correct_option: b
    explanation: "Correct. It is configuration, not data."

  - id: ats093-final-q29
    type: single_choice
    difficulty: intermediate
    learning_objective: "Keep the dump off the pod"
    source_readings:
      - sections/section-040/module-01/course-02-dump-and-restore-the-database.md
    prompt: "Why copy `/backup/keycloak.dump` out of the `postgres` pod?"
    options:
      - id: a
        text: "The pod deletes files older than one hour."
        explanation: "Not correct. Nothing deletes the file on a schedule."
      - id: b
        text: "`pg_restore` can read only files outside the cluster."
        explanation: "Not correct. It can read the file in the pod."
      - id: c
        text: "Keycloak reads the dump from your machine."
        explanation: "Not correct. Keycloak reads the database, not a dump file."
      - id: d
        text: "A dump that stays in the pod is lost with the pod."
        explanation: "Correct. Copy it to object storage or a backup system."
    correct_option: d
    explanation: "Correct. Copy it to object storage or a backup system."

  - id: ats093-final-q30
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the update strategy for patch upgrades"
    source_readings:
      - sections/section-040/module-01/course-03-upgrading-with-the-operator.md
    prompt: "Which `spec.update.strategy` rolls compatible changes, such as a newer patch release, pod by pod?"
    options:
      - id: a
        text: "`RecreateOnImageChange`"
        explanation: "Not correct. It stops all pods on any image change."
      - id: b
        text: "`Explicit` without changing `revision`"
        explanation: "Not correct. It rolls pod by pod, but you must manage the revision yourself; it is not the automatic choice."
      - id: c
        text: "`Immediate`"
        explanation: "Not correct. That is not a strategy of the operator."
      - id: d
        text: "`Auto`"
        explanation: "Correct. It runs a Job that compares old and new and rolls pod by pod when they are compatible."
    correct_option: d
    explanation: "Correct. It runs a Job that compares old and new and rolls pod by pod when they are compatible."

  - id: ats093-final-q31
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the route that carries users"
    source_readings:
      - sections/section-040/module-02/course-01-the-ways-to-export-and-import.md
    prompt: "Which route moves a realm together with its users?"
    options:
      - id: a
        text: "The health endpoint."
        explanation: "Not correct. It is not an export."
      - id: b
        text: "The offline export and import with `kc.sh`."
        explanation: "Correct. It runs as its own process against the database."
      - id: c
        text: "The partial export."
        explanation: "Not correct. It has no users."
      - id: d
        text: "A `KeycloakRealmImport` of a partial export."
        explanation: "Not correct. The file would have none."
    correct_option: b
    explanation: "Correct. It runs as its own process against the database."

  - id: ats093-final-q32
    type: single_choice
    difficulty: advanced
    learning_objective: "Check for leftovers"
    source_readings:
      - sections/section-040/module-02/course-02-working-with-the-export-file.md
    prompt: "After replacing a secret, which check do you run on the file?"
    options:
      - id: a
        text: "Check that it is a single line."
        explanation: "Not correct. Layout is unrelated."
      - id: b
        text: "Search it for the asterisks and for the real value."
        explanation: "Correct. Both are findings."
      - id: c
        text: "Check the file size."
        explanation: "Not correct. Size says nothing."
      - id: d
        text: "Check that it is sorted."
        explanation: "Not correct. Order is not a secret check."
    correct_option: b
    explanation: "Correct. Both are findings."

  - id: ats093-final-q33
    type: single_choice
    difficulty: intermediate
    learning_objective: "Plan upgrade changes"
    source_readings:
      - sections/section-040/module-02/course-04-planning-an-upgrade.md
    prompt: "Which upgrade type needs a window with no service?"
    options:
      - id: a
        text: "A scale from two to three instances."
        explanation: "Not correct. Scaling does not migrate."
      - id: b
        text: "A minor or major release that changes the schema."
        explanation: "Correct. Plan the window and keep a dump."
      - id: c
        text: "A patch release rolled with `Auto`."
        explanation: "Not correct. Patch rolls can be done one at a time."
      - id: d
        text: "A change of a label."
        explanation: "Not correct. A label does not restart."
    correct_option: b
    explanation: "Correct. Plan the window and keep a dump."

  - id: ats093-final-q34
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know where health is served"
    source_readings:
      - sections/section-050/module-01/course-01-health-endpoints-and-probes.md
    prompt: "On which port are the health endpoints served by default?"
    options:
      - id: a
        text: "The HTTP port, 8080."
        explanation: "Not correct. That is for users."
      - id: b
        text: "The cluster port, 7800."
        explanation: "Not correct. That is for the cache transport."
      - id: c
        text: "The database port, 5432."
        explanation: "Not correct. That is PostgreSQL."
      - id: d
        text: "The management port, 9000."
        explanation: "Correct. It is kept apart from user traffic."
    correct_option: d
    explanation: "Correct. It is kept apart from user traffic."

  - id: ats093-final-q35
    type: single_choice
    difficulty: advanced
    learning_objective: "Limit metric series"
    source_readings:
      - sections/section-050/module-01/course-02-metrics-on-the-management-port.md
    prompt: "What happens when you add the tags `clientId` and `idp` to user event metrics?"
    options:
      - id: a
        text: "Counters survive a restart."
        explanation: "Not correct. Counters reset on restart."
      - id: b
        text: "Metrics move to port 8080."
        explanation: "Not correct. The port is unchanged."
      - id: c
        text: "Events are written to the log."
        explanation: "Not correct. They are separate."
      - id: d
        text: "The number of series multiplies."
        explanation: "Correct. Use them only with few clients."
    correct_option: d
    explanation: "Correct. Use them only with few clients."

  - id: ats093-final-q36
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a log format"
    source_readings:
      - sections/section-050/module-01/course-03-logs-that-machines-can-read.md
    prompt: "Why does a log collector prefer `log-console-output=json`?"
    options:
      - id: a
        text: "It makes the log smaller."
        explanation: "Not correct. Size is not the point."
      - id: b
        text: "It hides personal data."
        explanation: "Not correct. Content is unchanged."
      - id: c
        text: "It sends the log to a file."
        explanation: "Not correct. The output is still the console."
      - id: d
        text: "It reads fields and keeps a stack trace in one record."
        explanation: "Correct. Fields can be searched."
    correct_option: d
    explanation: "Correct. Fields can be searched."

  - id: ats093-final-q37
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit the event table"
    source_readings:
      - sections/section-050/module-02/course-01-events-as-signals.md
    prompt: "Why set an expiration on events?"
    options:
      - id: a
        text: "It turns on the listener."
        explanation: "Not correct. The listener is separate."
      - id: b
        text: "They are stored in the database and grow with traffic."
        explanation: "Correct. Choose the types you save as well."
      - id: c
        text: "They cannot be read without it."
        explanation: "Not correct. They are readable."
      - id: d
        text: "It makes them private."
        explanation: "Not correct. Privacy needs access control."
    correct_option: b
    explanation: "Correct. Choose the types you save as well."

  - id: ats093-final-q38
    type: single_choice
    difficulty: intermediate
    learning_objective: "Link logs and traces"
    source_readings:
      - sections/section-050/module-02/course-02-tracing-a-request.md
    prompt: "What does `log-console-include-trace` add?"
    options:
      - id: a
        text: "The collector endpoint."
        explanation: "Not correct. The endpoint is separate."
      - id: b
        text: "The trace and span id to each log record."
        explanation: "Correct. It links a slow trace to its log lines."
      - id: c
        text: "A copy of the trace to a file."
        explanation: "Not correct. It writes no file."
      - id: d
        text: "Debug logging for the tracer."
        explanation: "Not correct. It changes the record, not the level."
    correct_option: b
    explanation: "Correct. It links a slow trace to its log lines."

  - id: ats093-final-q39
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the layer of a failure"
    source_readings:
      - sections/section-050/module-02/course-04-common-failures-and-their-signs.md
    prompt: "Where does `CreateContainerConfigError` show up?"
    options:
      - id: a
        text: "In the realm events."
        explanation: "Not correct. No realm was reached."
      - id: b
        text: "In the events of the pod."
        explanation: "Correct. The container never started."
      - id: c
        text: "In the container log."
        explanation: "Not correct. There is no log yet."
      - id: d
        text: "In the metrics."
        explanation: "Not correct. Nothing ran."
    correct_option: b
    explanation: "Correct. The container never started."
